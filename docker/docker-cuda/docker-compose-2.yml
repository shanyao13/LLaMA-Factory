services:
  llamafactory-sw:
    build:
      dockerfile: ./docker/docker-cuda/Dockerfile
      context: ../..
      args:
        INSTALL_BNB: "false"
        INSTALL_VLLM: "false"
        INSTALL_DEEPSPEED: "true"
        INSTALL_FLASHATTN: "false"
        INSTALL_LIGER_KERNEL: "false"
        INSTALL_HQQ: "false"
        INSTALL_EETQ: "false"
        PIP_INDEX: https://pypi.org/simple
    container_name: llamafactory-sw
    volumes:
      - ../../hf_cache:/root/.cache/huggingface
      - ../../ms_cache:/root/.cache/modelscope
      - ../../om_cache:/root/.cache/openmind
      - ../../data:/app/data
      - ../../output:/app/output
      # - /mnt/zzb/peixunban/zzb6/home/swZheng/OLMo/tmp/output-1B-infer_model-step177:/app/pretrain_model  # 新增挂载路径
      # - /mnt/zzb/peixunban/zzb6/home/swZheng/OLMo/tmp:/app/tmp
      # - /root/swZheng/dev/LLaMA-Factory/olmo_hf_pre_model:/app/tmp2
    ports:
      - "7861:7860"
      - "8001:8000"
    ipc: host
    tty: true
    shm_size: "16gb"
    stdin_open: true
    command: bash
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: "all"
            capabilities: [gpu]
    restart: unless-stopped
